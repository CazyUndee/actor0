name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  publish-libraries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish harness
        run: npm publish --workspace @actor0/harness
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish providers
        run: npm publish --workspace @actor0/providers
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Attach CLI bundle to release
        run: |
          gh release upload "${{ github.ref_name }}" \
            apps/cli/dist/cli.mjs \
            apps/cli/dist/tui.mjs \
            apps/cli/dist/env-worker.mjs \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
