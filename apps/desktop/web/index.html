  <body>
    <div id="root"></div>
    <!-- Neutralino client loader. Window mode: the shell injects globals+library
         with a real token — loading the static globals endpoint would clobber it
         (it serves NL_TOKEN=''), so we must not interfere. Chrome mode: the
         globals endpoint is useful for NL_PORT/NL_PATH/NL_MODE/NL_OS but its
         empty token makes neutralino.js replace the page with NE_CL_IVCTOKN, so
         we load globals only. The launcher writes shell-mode.json to tell us. -->
    <script>
      (function () {
        if (typeof window.NL_TOKEN !== "undefined" && window.NL_TOKEN !== "") {
          if (typeof window.Neutralino === "undefined") {
            document.write('<script src="/neutralino.js"><\/script>');
          }
          return;
        }
        var mode = null;
        try {
          var x = new XMLHttpRequest();
          x.open("GET", "/shell-mode.json", false);
          if (x.status === 200) mode = (JSON.parse(x.responseText) || {}).mode || null;
        } catch (e) {}
        if (mode === "window") {
          // Rely on injection for the real token and library. If injection
          // didn't run, the native APIs won't be available but the app still
          // works via the port file — better than destroying the page.
          return;
        }
        // Chrome mode (or unknown): load globals for environment info, skip
        // neutralino.js because the empty token is fatal to it.
        document.write('<script src="/__neutralino_globals.js"><\/script>');
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
