    <div id="root"></div>
    <!-- Neutralino globals/client loader. With tokenSecurity "none" the served
         globals endpoint carries the real session token, so the page can load
         globals + client library directly and native APIs work without
         injection. Minor tradeoff: any local client reaching this port can call
         the allow-listed APIs; the nativeAllowList stays minimal. -->
    <script>
      (function () {
        if (typeof window.NL_TOKEN !== "undefined" && window.NL_TOKEN !== "") {
          if (typeof window.Neutralino === "undefined") {
            document.write('<script src="/neutralino.js"><\/script>');
          }
          return;
        }
        document.write('<script src="/__neutralino_globals.js"><\/script>');
        if (typeof window.Neutralino === "undefined") {
          document.write('<script src="/neutralino.js"><\/script>');
        }
      })();
    </script>
